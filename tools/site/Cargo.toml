[package]
name = "ripscope-site"
version = "0.1.0"
edition = "2024"
description = "Build the static Ripscope website from selected documentation chapters"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
base16ct = { version = "=1.0.0", features = ["alloc"] }
regex = "=1.13.1"

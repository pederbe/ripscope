# A position-dependent Linux executable starts about 75 µs sooner, a tenth of a one-shot
# query, because the loader relocates no data pages of its own. Shared libraries keep
# their address randomisation.
# Functions start on 64-byte boundaries, so a change elsewhere cannot move a hot loop
# across one. Text and egrep searches take 3 to 8% less time, and timings do not shift
# with unrelated code.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))']
rustflags = ["-C", "relocation-model=static", "-C", "llvm-args=-align-all-functions=6"]

# The bundled SQLite without what Ripscope never uses: memory-status accounting, which takes a
# global lock on every allocation, the shared page-cache group that memory management needs,
# and the full-text, R-tree and dbstat modules every connection registers when it opens.
[env]
LIBSQLITE3_FLAGS = "SQLITE_DEFAULT_MEMSTATUS=0 -USQLITE_ENABLE_MEMORY_MANAGEMENT -USQLITE_ENABLE_FTS3 -USQLITE_ENABLE_FTS3_PARENTHESIS -USQLITE_ENABLE_FTS5 -USQLITE_ENABLE_RTREE -USQLITE_ENABLE_DBSTAT_VTAB"

name: Compatibility difference
description: Ripscope's output or behavior differs from cscope for the same input.
labels: [compatibility]
body:
  - type: markdown
    attributes:
      value: |
        Check the [documented differences](https://ripscope.com/docs/reference/differences-from-cscope) first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: |
        Which query or behavior differs, and how does it affect your task?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: |
        What result did you expect from the cscope comparison?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: |
        Include the smallest C source and headers, both commands with query fields and patterns, both outputs, both versions and the platform where available. Describe the observations and say which details are unknown.
    validations:
      required: true

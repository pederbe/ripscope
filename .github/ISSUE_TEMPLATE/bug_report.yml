name: Bug report
description: Ripscope crashed, refused valid input, or returned wrong results.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a difference from cscope, use the **Compatibility difference** form instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: |
        What happened, and how does it affect your task?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: |
        What should happen instead? You do not need to propose a fix.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: |
        Include the smallest source files, commands, exact output or error, Ripscope version or commit, platform and editor integration where available. Describe your observations even if you cannot reproduce the problem yet, and say which details are unknown.
    validations:
      required: true

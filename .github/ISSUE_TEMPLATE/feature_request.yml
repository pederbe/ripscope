name: Feature request
description: Suggest a new capability or workflow improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: |
        What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: |
        What would Ripscope let you do? You do not need to design the solution.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: |
        Example commands or editor interactions, current workarounds or relevant links, if available.

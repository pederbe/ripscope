name: CI

# Every pull request runs this workflow, so the required "CI" check always reports.
# Changes to documentation alone skip the build and test jobs.

on:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    name: Classify changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      media: ${{ steps.filter.outputs.media }}
      website: ${{ steps.website.outputs.changed }}
      winget: ${{ steps.website.outputs.winget }}
      packages_repository: ${{ steps.website.outputs.packages_repository }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            media:
              - "tools/media/**"
            code:
              - '!docs/**'
              - '!**/*.md'
              - '!book.toml'
              - '!site/**'
              - '!tools/site/**'
              - '!scripts/build-site.sh'
              - '!wrangler.jsonc'
              - '!.gitignore'
              - '!.github/workflows/ci.yml'
              - '!.github/workflows/docs.yml'
              - '!.github/workflows/website-deploy.yml'
              - '!.github/ISSUE_TEMPLATE/**'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: website
        with:
          filters: |
            changed:
              - "README.md"
              - "GLOSSARY.md"
              - "GLOSSARY-MAP.md"
              - "docs/**"
              - "site/**"
              - "book.toml"
              - "wrangler.jsonc"
              - "tools/site/**"
              - "scripts/build-site.sh"
              - ".github/workflows/ci.yml"
              - ".github/workflows/docs.yml"
              - ".github/workflows/website-deploy.yml"
              - ".github/dependency-pins.json"
            winget:
              - ".github/workflows/winget.yml"
              - "tools/release/src/winget.rs"
            packages_repository:
              - ".github/workflows/package-repository.yml"
              - "tools/release/src/repository.rs"

  check:
    name: ${{ matrix.os }}
    needs: changes
    # Scheduled and manual runs skip the classification and always check.
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.code != 'false')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Renovate advances the pinned stable compiler in the daily dependency batch.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Session diagnostics
        run: cargo test --locked --features session-profile --test session_profile

      - name: Latency tooling
        # Runs only in a checkout that includes the latency tool.
        if: runner.os == 'Linux' && hashFiles('tools/latency/Cargo.toml') != ''
        run: |
          cargo fmt --manifest-path tools/latency/Cargo.toml --check
          cargo clippy --locked --all-targets --manifest-path tools/latency/Cargo.toml -- -D warnings
          cargo test --locked --all-targets --manifest-path tools/latency/Cargo.toml

      - name: Media tooling
        if: github.event_name != 'pull_request' || needs.changes.outputs.media == 'true'
        run: |
          cargo fmt --manifest-path tools/media/Cargo.toml --check
          cargo clippy --locked --all-targets --manifest-path tools/media/Cargo.toml -- -D warnings
          cargo test --locked --manifest-path tools/media/Cargo.toml

      - name: Release tooling
        run: |
          cargo fmt --manifest-path tools/release/Cargo.toml --check
          cargo clippy --locked --all-targets --manifest-path tools/release/Cargo.toml -- -D warnings
          cargo test --locked --manifest-path tools/release/Cargo.toml

  website:
    needs: changes
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      needs.changes.outputs.website != 'false'
    uses: ./.github/workflows/docs.yml

  winget:
    needs: changes
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      needs.changes.outputs.winget != 'false'
    uses: ./.github/workflows/winget.yml

  packages-repository:
    needs: changes
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      needs.changes.outputs.packages_repository != 'false'
    uses: ./.github/workflows/package-repository.yml
    permissions:
      contents: read
      attestations: read

  # The one required check. It passes when every check passed or was skipped as
  # unneeded, and fails otherwise.
  ci:
    name: CI
    needs: [changes, check, website, winget, packages-repository]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Require passing checks
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          EVENT: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          WEBSITE_SELECTED: ${{ needs.changes.outputs.website }}
          WEBSITE_RESULT: ${{ needs.website.result }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            test "$CHANGES_RESULT" = success
            if [ "$WEBSITE_SELECTED" = true ]; then
              test "$WEBSITE_RESULT" = success
            else
              test "$WEBSITE_SELECTED" = false
              test "$WEBSITE_RESULT" = skipped
            fi
          fi
          test -n "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "A check finished with: $result"; exit 1 ;;
            esac
          done

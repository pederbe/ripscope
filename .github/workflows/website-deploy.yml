name: Deploy website after approval

# Staged for a future, explicitly authorized deployment. There are no automatic
# triggers and an unset SITE_DEPLOY_ENABLED repository variable skips both jobs.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact existing version tag, such as v0.1.0
        type: string
        required: true
      release_commit:
        description: Exact 40-character commit reviewed for this deployment
        type: string
        required: true
      confirmation:
        description: Type Deploy ripscope.com to confirm the deployment
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: website-production
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.private == false &&
      vars.SITE_DEPLOY_ENABLED == 'true' &&
      inputs.confirmation == 'Deploy ripscope.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      # This job names no environment and receives no provider credentials. A
      # missing environment or absent reviewer rule fails before deployment starts.
      - name: Validate inputs and existing approval protection
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          gh api --method GET "repos/$GITHUB_REPOSITORY/environments/site-production" > "$RUNNER_TEMP/site-environment.json"
          jq -e '
            type == "object" and
            .name == "site-production" and
            (.protection_rules | type == "array") and
            any(.protection_rules[];
              .type == "required_reviewers" and
              (.reviewers | type == "array") and
              (.reviewers | length > 0) and
              all(.reviewers[];
                type == "object" and
                (.type == "User" or .type == "Team") and
                (.reviewer | type == "object") and
                (.reviewer.id | type == "number") and
                (.reviewer.id | floor) == .reviewer.id and
                .reviewer.id > 0
              )
            )
          ' "$RUNNER_TEMP/site-environment.json"

  deploy:
    needs: preflight
    if: >-
      needs.preflight.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.private == false &&
      vars.SITE_DEPLOY_ENABLED == 'true' &&
      inputs.confirmation == 'Deploy ripscope.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: site-production
      url: https://ripscope.com
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable selected tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Select Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: mdbook@0.5.4,lychee@0.24.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Build selected release source and verify internal links
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: scripts/build-site.sh --release "$RELEASE_TAG"
      - name: Validate static hosting without deploying
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix tools/site
          node tools/site/node_modules/wrangler/bin/wrangler.js deploy --dry-run --config wrangler.jsonc --outdir "$RUNNER_TEMP/site-dry-run"
      - name: Deploy approved release website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node tools/site/node_modules/wrangler/bin/wrangler.js deploy --config wrangler.jsonc

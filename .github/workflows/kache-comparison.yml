name: Cache comparison

on:
  push:
    branches: [contrib/kache-ci]

permissions:
  contents: read

concurrency:
  group: cache-comparison-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  KACHE_KEY_ENV_VARS: CARGO_MANIFEST_DIR

jobs:
  compare:
    name: ${{ matrix.cache }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cache: [current, kache]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        if: matrix.cache == 'current'
        with:
          key: kache-comparison
      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed
        if: matrix.cache == 'kache'
        with:
          version: v2.1.1
          cache-key-prefix: kache-comparison
          cache-executables: true
          pr-comment: false
          max-size: 2GiB
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Session diagnostics
        run: cargo test --locked --features session-profile --test session_profile

name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact existing version tag, such as v0.1.0
        required: true
        type: string
      source_sha:
        description: Exact 40-character source commit
        required: true
        type: string
      publish:
        description: Create attestations and a draft GitHub release after environment approval
        default: false
        type: boolean
      automatic:
        description: Publish automatically after all platform checks
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.guard.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.99.1'
      # Built with no token in the environment or in .git/config. Only the next step,
      # which runs the guard, is given one.
      - name: Build the release guard
        run: cargo build --locked --quiet --manifest-path tools/release/Cargo.toml
      - id: guard
        name: Validate immutable source and publication protection
        env:
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          PUBLISH: ${{ inputs.publish }}
          AUTOMATIC: ${{ inputs.automatic }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$DISPATCH_REF" = "refs/tags/$TAG"
          test "$DISPATCH_SHA" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          release=tools/release/target/debug/ripscope-release
          "$release" check-tag "$TAG"
          if [ "$PUBLISH" = true ]; then
            test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = false
            if [ "$AUTOMATIC" = true ]; then
              gh api "repos/$GITHUB_REPOSITORY/environments/automated-release" > "$RUNNER_TEMP/release-environment.json"
              "$release" check-automated-environment "$RUNNER_TEMP/release-environment.json"
              gh api "repos/$GITHUB_REPOSITORY/environments/automated-release/deployment-branch-policies" \
                --jq '.branch_policies | length == 1 and .[0].name == "v*" and .[0].type == "tag"' | grep -qx true
            else
              gh api "repos/$GITHUB_REPOSITORY/environments/release" > "$RUNNER_TEMP/release-environment.json"
              "$release" check-environment "$RUNNER_TEMP/release-environment.json"
            fi
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
  linux:
    needs: preflight
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.99.1'
      - name: Build exact Linux archive
        run: |
          set -euo pipefail
          release="cargo run --locked --quiet --manifest-path tools/release/Cargo.toml --"
          curl --proto '=https' --tlsv1.2 -fL "$($release profile linux mold_url)" -o "$RUNNER_TEMP/mold.tar.gz"
          $release linux --work "$RUNNER_TEMP/linux" \
            --toolchain "$HOME/.rustup/toolchains/1.99.1-x86_64-unknown-linux-gnu" --mold-archive "$RUNNER_TEMP/mold.tar.gz"
      - name: Package the inspected executable and smoke-test the packages
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm cpio
          version=${TAG#v}
          bash scripts/package-linux.sh "$version" "$RUNNER_TEMP/linux/ripscope-$version-x86_64-linux-gnu" "$RUNNER_TEMP/linux/dist"
          podman pull docker.io/library/debian:12-slim
          podman pull docker.io/library/almalinux:8-minimal
          podman run --rm --network=none --tmpfs /work:rw,exec,mode=1777 -v "$RUNNER_TEMP/linux/dist:/input:ro" docker.io/library/debian:12-slim sh -ec '
            dpkg -i /input/ripscope_*_amd64.deb; cd /work; printf "int value;\n" > source.c
            ripscope -bk source.c; ripscope -dL -1 value | grep "source.c value 1 int value;"
            dpkg -r ripscope; test ! -e /usr/bin/ripscope; test -f ripscope.db'
          podman run --rm --network=none --tmpfs /work:rw,exec,mode=1777 -v "$RUNNER_TEMP/linux/dist:/input:ro" docker.io/library/almalinux:8-minimal sh -ec '
            rpm -i /input/ripscope-*.x86_64.rpm; cd /work; printf "int value;\n" > source.c
            ripscope -bk source.c; ripscope -dL -1 value | grep "source.c value 1 int value;"
            rpm -e ripscope; test ! -e /usr/bin/ripscope; test -f ripscope.db'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-release
          path: ${{ runner.temp }}/linux/dist/*
          if-no-files-found: error
      - name: Retain failed Linux release diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-linux-release-${{ inputs.tag }}
          path: |
            ${{ runner.temp }}/linux/logs/
            ${{ runner.temp }}/linux/receipt.json
          if-no-files-found: warn
          retention-days: 7
  windows:
    needs: preflight
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.99.1'
      - name: Build exact Windows archive and check installer
        env:
          TAG: ${{ inputs.tag }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $profile = Get-Content tools/release/windows-release-profile.json -Raw | ConvertFrom-Json
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $msvc = Join-Path $vs "VC\Tools\MSVC\$($profile.msvc_directory)"
          if (-not (Test-Path -LiteralPath $msvc)) { throw 'Pinned MSVC is unavailable; install the recorded profile before release.' }
          $toolchain = Join-Path $HOME '.rustup\toolchains\1.99.1-x86_64-pc-windows-msvc'
          cargo run --locked --manifest-path tools/release/Cargo.toml -- windows --work "$env:RUNNER_TEMP\windows" --toolchain $toolchain --msvc $msvc --sdk "${env:ProgramFiles(x86)}\Windows Kits\10"
          if ($LASTEXITCODE) { throw 'Windows archive build failed' }
          $version = $env:TAG.Substring(1)
          cargo run --locked --example check-installers -- --archive "$env:RUNNER_TEMP\windows\dist\ripscope-$version-x86_64-windows-msvc.zip" --installer "$PWD\install.ps1" --work "$env:RUNNER_TEMP\windows-installer"
          if ($LASTEXITCODE) { throw 'Windows installer checks failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: ${{ runner.temp }}/windows/dist/*
          if-no-files-found: error
      - name: Retain failed Windows release diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-windows-release-${{ inputs.tag }}
          path: |
            ${{ runner.temp }}/windows/logs/
            ${{ runner.temp }}/windows/receipt.json
          if-no-files-found: warn
          retention-days: 7
  publish:
    needs: [preflight, linux, windows]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-26.04
    environment: ${{ inputs.automatic && 'automated-release' || 'release' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.1'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-release'
          path: artifacts
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.deb
            artifacts/*.rpm
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          AUTOMATIC: ${{ inputs.automatic }}
        run: |
          set -euo pipefail
          cargo run --locked --quiet --manifest-path tools/release/Cargo.toml -- release-notes "$TAG" "$RUNNER_TEMP/notes.md"
          # Platform builders each emit SHA256SUMS for local use. Publish their
          # uniquely named sidecars, excluding the colliding merged manifests.
          assets=(artifacts/*.tar.gz artifacts/*.zip artifacts/*.deb artifacts/*.rpm artifacts/*.sha256)
          for artifact in "${assets[@]}"; do test -f "$artifact"; done
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A published release is immutable. Re-running must never replace it.
            draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            if [ "$draft" = true ]; then
              mkdir "$RUNNER_TEMP/frozen-assets"
              gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/asset-names"
              for artifact in "${assets[@]}"; do
                name=$(basename "$artifact")
                if grep -Fxq "$name" "$RUNNER_TEMP/asset-names"; then
                  gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$RUNNER_TEMP/frozen-assets"
                  cmp "$artifact" "$RUNNER_TEMP/frozen-assets/$name"
                else
                  gh release upload "$TAG" "$artifact" --repo "$GITHUB_REPOSITORY"
                fi
              done
            fi
          else
            gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --target "$SOURCE_SHA" --draft --title "Ripscope ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          if [ "$AUTOMATIC" = true ]; then
            latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
            newest=$(printf '%s\n' "$TAG" "$latest" | sort -V | tail -1)
            test "$newest" = "$TAG" || { echo "A newer release $latest already exists." >&2; exit 1; }
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
            # Plugin managers follow this branch. It contains generated release
            # metadata, so subsequent release commits may be on sibling histories.
            old=$(git ls-remote origin refs/heads/release | cut -f1)
            git push --force-with-lease="refs/heads/release:$old" origin "$SOURCE_SHA:refs/heads/release"
          fi
      - name: Refresh the published website
        if: inputs.automatic
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_DEPLOY_HOOK"
          curl --silent --show-error --fail --retry 2 --connect-timeout 10 --max-time 60 \
            --request POST "$CLOUDFLARE_DEPLOY_HOOK" --output "$RUNNER_TEMP/site-build.json"
          jq -e '.success == true and (.result.build_uuid | type == "string" and length > 0)' "$RUNNER_TEMP/site-build.json" >/dev/null

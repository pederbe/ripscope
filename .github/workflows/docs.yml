name: Website verification

# This optional workflow never deploys.
# Cloudflare Workers Builds handles production deployment.
on:
  pull_request:
    paths:
      - "tools/site/**"
      - "scripts/build-site.sh"
      - ".github/workflows/docs.yml"
      - ".github/workflows/website-deploy.yml"
      - ".github/dependency-pins.json"
  workflow_dispatch:
    inputs:
      check_external:
        description: Check remote link responses as well as internal links
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: website-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
          rustup default 1.99.1
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: mdbook@0.5.4,lychee@0.24.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'
      - name: Check site tooling
        run: |
          cargo fmt --manifest-path tools/site/Cargo.toml --check
          cargo clippy --locked --all-targets --manifest-path tools/site/Cargo.toml -- -D warnings
          cargo test --locked --manifest-path tools/site/Cargo.toml
      - name: Build and check links
        env:
          CHECK_EXTERNAL: ${{ inputs.check_external }}
        run: |
          set -euo pipefail
          args=(--dev)
          if [ "$CHECK_EXTERNAL" = true ]; then args+=(--check-external); fi
          scripts/build-site.sh "${args[@]}"
      - name: Validate static hosting without deploying
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix tools/site
          node tools/site/node_modules/wrangler/bin/wrangler.js deploy --dry-run --config wrangler.jsonc --outdir "$RUNNER_TEMP/site-dry-run"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-verification-${{ github.sha }}
          path: target/site
          if-no-files-found: error
          retention-days: 7

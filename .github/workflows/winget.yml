name: WinGet

# After a release is published, generates its WinGet manifests from the published
# Windows ZIP and checks them with the WinGet client: installing the previous release,
# upgrading to this one, a search, the editors' install command and removal. It never
# changes a release. Automatic release dispatches also submit and complete the
# WinGet PR. CI and manual preparation remain read-only by default.

on:
  # A release the maintainer publishes from a draft.
  release:
    types: [published]
  # CI calls this check for affected files, against the latest release.
  workflow_call:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, such as v0.2.4
        required: true
        type: string
      submit:
        description: Submit or complete this version's WinGet pull request
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: winget-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  manifests:
    runs-on: windows-2025
    timeout-minutes: 45
    environment: ${{ inputs.submit && 'distribution' || '' }}
    steps:
      - name: Require submission setup
        if: inputs.submit
        shell: bash
        env:
          ENABLED: ${{ vars.WINGET_ENABLED }}
          TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          test "$ENABLED" = true || { echo 'WinGet submission is disabled' >&2; exit 1; }
          test -n "$TOKEN" || { echo 'WINGET_TOKEN is not configured in distribution' >&2; exit 1; }
      # The tools come from the default branch, or the branch under test, since older
      # release tags predate them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && github.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Select the published release and its predecessor
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          # A release run without publication, or one awaiting the maintainer, has no
          # published release yet.
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" != false ]; then
            echo "$TAG is not a published release." >> "$GITHUB_STEP_SUMMARY"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 100 --json tagName --jq '.[].tagName' | sort -V | grep -B1 -x "$TAG" | head -1)
          test -n "$previous" && test "$previous" != "$TAG"
          mkdir -p "$RUNNER_TEMP/winget"
          for tag in "$previous" "$TAG"; do
            version=${tag#v}
            mkdir -p "$RUNNER_TEMP/releases/$tag"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/releases/$tag" \
              --pattern "ripscope-$version-x86_64-windows-msvc.zip" \
              --pattern "ripscope-$version-x86_64-windows-msvc.zip.sha256"
            date=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq '.publishedAt[:10]')
            cargo run --locked --quiet --manifest-path tools/release/Cargo.toml -- winget "$version" \
              "$RUNNER_TEMP/releases/$tag/ripscope-$version-x86_64-windows-msvc.zip" "$date" "$RUNNER_TEMP/winget/$tag"
          done
          {
            echo "published=true"
            echo "tag=$TAG"
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"
      - name: Install, upgrade, use and remove the package with WinGet
        if: steps.release.outputs.published == 'true'
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          PREVIOUS: ${{ steps.release.outputs.previous }}
        run: |
          set -euo pipefail
          manifests() { echo "$RUNNER_TEMP/winget/$1/manifests/p/PederBergan/Ripscope/${1#v}"; }
          cargo run --locked --quiet --manifest-path tools/release/Cargo.toml -- winget-check \
            "$(manifests "$PREVIOUS")" "$(manifests "$TAG")" \
            "$GITHUB_WORKSPACE\\install.ps1" "$RUNNER_TEMP\\winget-check"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.release.outputs.published == 'true'
        with:
          name: winget-manifests-${{ steps.release.outputs.tag }}
          path: ${{ runner.temp }}/winget/${{ steps.release.outputs.tag }}/manifests
          if-no-files-found: error
      - name: Check the official WinGet Create client
        if: steps.release.outputs.published == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = gh api repos/microsoft/winget-create/releases/latest | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot select WinGetCreate' }
          $asset = $release.assets | Where-Object name -eq wingetcreate.exe
          if (!$asset -or $asset.digest -notmatch '^sha256:([0-9a-f]{64})$') { throw 'WinGetCreate checksum unavailable' }
          $client = "$env:RUNNER_TEMP/wingetcreate.exe"
          gh release download $release.tag_name --repo microsoft/winget-create --pattern wingetcreate.exe --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download WinGetCreate' }
          if ((Get-FileHash $client -Algorithm SHA256).Hash.ToLower() -ne $asset.digest.Substring(7)) { throw 'WinGetCreate checksum mismatch' }
          & $client --help
          if ($LASTEXITCODE -ne 0) { throw 'WinGetCreate cannot start' }
      - name: Prepare or complete the WinGet pull request
        if: steps.release.outputs.published == 'true'
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          SUBMIT: ${{ inputs.submit || false }}
          GH_TOKEN: ${{ inputs.submit && secrets.WINGET_TOKEN || github.token }}
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          WINGET_CHECKED: 'true'
        run: |
          set -euo pipefail
          export WINGET_CREATE="$RUNNER_TEMP/wingetcreate.exe"
          mode=--prepare
          if [ "$SUBMIT" = true ]; then mode=--submit; fi
          cargo run --locked --manifest-path tools/release/Cargo.toml -- winget-submit \
            "$RUNNER_TEMP/winget/$TAG/manifests/p/PederBergan/Ripscope/${TAG#v}" PederBergan.Ripscope "${TAG#v}" "$mode"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: winget-description-${{ steps.release.outputs.tag || github.run_id }}
          path: winget-pr-body.md
          if-no-files-found: ignore

name: Release changelog

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published tag, or empty for the latest release
        type: string
        default: ''
      check_only:
        description: Show the proposed update without creating a pull request
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-changelog
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
      pr: ${{ steps.prepare.outputs.pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Select an actually published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          latest=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -r '[.[][] | select(.draft == false)] | max_by([.published_at, .id]) | .tag_name // empty')
          if [ -z "$latest" ]; then
            echo 'No published release to record.'
            exit 0
          fi
          tag=${REQUESTED_TAG:-$latest}
          if [ "$tag" != "$latest" ]; then
            echo 'A later release has already been published.'
            exit 0
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = false
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Prepare the published notes pull request
        id: prepare
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          CHECK_ONLY: ${{ inputs.check_only }}
        run: |
          mode=record
          if [ "$CHECK_ONLY" = true ]; then mode=check-only; fi
          bash scripts/record-release-changelog.sh "$TAG" "$mode"

  documentation:
    needs: prepare
    if: needs.prepare.outputs.sha != ''
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  merge:
    needs: [prepare, documentation]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.sha != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Report checks and merge the checked changelog
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
          PR: ${{ needs.prepare.outputs.pr }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
        run: |
          set -euo pipefail
          # Only the generated changelog receives this workflow's CI status.
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          test "$(git diff --name-only origin/main...HEAD)" = CHANGELOG.md
          git diff --check origin/main...HEAD
          state=failure
          if [ "$DOCUMENTATION_RESULT" = success ]; then state=success; fi
          # Dispatch job checks do not satisfy pull-request rules. Report the
          # actual result for the exact revision the documentation job checked.
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f context=CI -f state="$state" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description='Release changelog documentation checks' >/dev/null
          test "$state" = success
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$SHA"

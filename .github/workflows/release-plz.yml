name: Release-plz

# Every Thursday, release-plz opens or updates one release pull request when there
# are unreleased changes. It merges once CI passes. Pushes to main refresh an
# open release pull request. Merging it tags the version, and the Release
# workflow builds and publishes it.
on:
  push:
    branches: [main]
  schedule:
    - cron: '43 6 * * 4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-plz
  cancel-in-progress: false
  queue: max

jobs:
  release-pr:
    if: >-
      github.repository == 'pederbe/ripscope' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Prepare weekly release or refresh an open release pull request
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName \
              --jq '[.[] | select(.headRefName | startswith("release-plz-"))] | length')
            if [ "$open" = 0 ]; then
              echo run=false >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo run=true >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.prepare.outputs.run == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
        if: steps.prepare.outputs.run == 'true'
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        if: steps.prepare.outputs.run == 'true'
        with:
          tool: git-cliff@2.14.2
      # CI runs only on pull requests opened with a personal token, not with the workflow token.
      - id: release-plz
        if: steps.prepare.outputs.run == 'true'
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Complete and check the release pull request
        if: steps.release-plz.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          RELEASE_BRANCH: ${{ fromJSON(steps.release-plz.outputs.pr || '{}').head_branch }}
          PR_NUMBER: ${{ fromJSON(steps.release-plz.outputs.pr || '{}').number }}
        run: |
          set -euo pipefail
          gh auth setup-git --hostname github.com
          git fetch origin "refs/heads/$RELEASE_BRANCH"
          git switch --detach FETCH_HEAD
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "ripscope") | .version')
          previous=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          # Cargo's package comparison cannot see every archive/build change.
          # Use git-cliff's native whole-history bump as a lower bound.
          ignored=$(git tag --list 'v*' | awk -v previous="$previous" '$0 != previous' | sed 's/\./\\./g' | paste -sd '|' -)
          minimum=$(git-cliff --config cliff.toml --ignore-tags "^($ignored)$" --bump --bumped-version "$previous..origin/main")
          minimum=${minimum#v}
          next=$(printf '%s\n' "$version" "$minimum" | sort -V | tail -1)
          if [ "$next" != "$version" ]; then
            release-plz set-version "ripscope@$next"
            version=$next
          fi
          # Rebuild from main on every refresh, so an open release PR never
          # accumulates old versions of its own unpublished section.
          git show origin/main:CHANGELOG.md > CHANGELOG.md
          tags=$(printf '%s|v%s' "$previous" "$version" | sed 's/\./\\./g')
          git-cliff --config cliff.toml --tag-pattern "^($tags)$" --tag "v$version" "$previous..origin/main" --prepend CHANGELOG.md
          RUSTFLAGS='' cargo run --locked --quiet --manifest-path tools/release/Cargo.toml -- check-release-notes "$previous"
          sed -i "s/^;; Version:.*/;; Version: $version/" contrib/emacs/ripscope.el
          if ! git diff --quiet -- Cargo.toml Cargo.lock CHANGELOG.md contrib/emacs/ripscope.el; then
            git add Cargo.toml Cargo.lock CHANGELOG.md contrib/emacs/ripscope.el
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore: complete release notes and editor metadata'
            git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
          fi
          RUSTFLAGS='' cargo run --locked --quiet --manifest-path tools/release/Cargo.toml -- release-notes "v$version" "$RUNNER_TEMP/release-notes.md"
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --title "chore: release v$version" --body-file "$RUNNER_TEMP/release-notes.md"
      - name: Merge the release pull request once CI passes
        if: steps.release-plz.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          PR: ${{ steps.release-plz.outputs.pr }}
        run: gh pr merge "$(jq -r .number <<< "$PR")" --repo "$GITHUB_REPOSITORY" --squash --auto

  release:
    if: github.repository == 'pederbe/ripscope' && github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - id: release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Workflow-token events do not start other workflows. Dispatch the build
      # explicitly after release-plz has tagged it. The Release workflow creates
      # the draft, qualifies the assets and publishes the crate.
      - name: Build and publish the tagged release
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          set -euo pipefail
          tag=$(jq -r '.[] | select(.package_name == "ripscope") | .tag' <<< "$RELEASES")
          if [ -n "$tag" ]; then
            git fetch origin "refs/tags/$tag"
            sha=$(git rev-parse 'FETCH_HEAD^{commit}')
            gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$tag" \
              -f tag="$tag" -f source_sha="$sha" -f publish=true -f automatic=true
          fi

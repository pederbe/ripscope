# Monthly version updates, grouped so each ecosystem opens at most one pull request.
# Security updates for advisories arrive separately as soon as they are published.
version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/tools/media"
      - "/tools/release"
      - "/tools/site"
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/tools/site"
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

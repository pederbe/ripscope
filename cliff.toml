[changelog]
header = """# Changelog

All notable changes are recorded here. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and versions follow
[Semantic Versioning](https://semver.org/). Before 1.0, a minor version may change the
index format or command-line behavior, and its entry says so.

## [Unreleased]
"""
body = """
{%- macro source(commit) -%}
{%- set subject = commit.raw_message | split(pat="\n") | first -%}
{%- set source = subject | split(pat=" (#") | last | trim_end_matches(pat=")") -%}
{%- if subject is matching(" [(]#[0-9]+[)]$") -%}
([#{{ source }}](https://github.com/pederbe/ripscope/pull/{{ source }}))
{%- else -%}
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/pederbe/ripscope/commit/{{ commit.id }}))
{%- endif -%}
{%- endmacro -%}
{%- macro title(commit) -%}
{%- set title = commit.message | split(pat="\n") | first | trim -%}
{%- if title is matching(" [(]#[0-9]+[)]$") -%}
{%- set source = title | split(pat=" (#") | last | trim_end_matches(pat=")") -%}
{%- set suffix = " (#" ~ source ~ ")" -%}
{%- set title = title | trim_end_matches(pat=suffix) -%}
{%- endif -%}
{{ title | trim | upper_first }}
{%- endmacro -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{{ self::title(commit=commit) }} {{ self::source(commit=commit) }}
{%- endfor %}
{% endfor %}

[Full comparison](https://github.com/pederbe/ripscope/compare/{{ previous.version }}...{{ version }})
"""
trim = true
postprocessors = [
  { pattern = '\n{3,}', replace = "\n\n" },
]
[git]
conventional_commits = true
filter_unconventional = false
sort_commits = "oldest"
protect_breaking_commits = true
commit_preprocessors = [
  # Normalize historical titles without importing their description text.
  { pattern = '(?s)^[^\n]* \(#117\)(?:\n.*)?$', replace = 'chore: record the previous release (#117)' },
  { pattern = '(?s)^[^\n]* \(#118\)(?:\n.*)?$', replace = 'chore: update website tooling (#118)' },
  { pattern = '(?s)^[^\n]* \(#119\)(?:\n.*)?$', replace = 'fix: handle source inputs without blocking (#119)' },
  { pattern = '(?s)^[^\n]* \(#120\)(?:\n.*)?$', replace = 'docs: explain cargo-binstall installation (#120)' },
  { pattern = '(?s)^[^\n]* \(#121\)(?:\n.*)?$', replace = 'ci: check homepage links in documentation builds (#121)' },
  { pattern = '(?s)^[^\n]* \(#122\)(?:\n.*)?$', replace = 'docs: make installation and everyday use easier to find (#122)' },
  { pattern = '(?s)^[^\n]* \(#123\)(?:\n.*)?$', replace = 'docs: make command help easier to scan (#123)' },
  { pattern = '(?s)^[^\n]* \(#125\)(?:\n.*)?$', replace = 'docs: keep editor setup instructions current (#125)' },
  { pattern = '(?s)^[^\n]* \(#126\)(?:\n.*)?$', replace = 'fix!: install the latest release consistently (#126)' },
  { pattern = '(?s)^[^\n]* \(#129\)(?:\n.*)?$', replace = 'feat!: discover editor projects and refresh saved changes automatically (#129)' },
  { pattern = '(?s)^[^\n]* \(#131\)(?:\n.*)?$', replace = 'feat: provide an Arch package recipe with each Linux release (#131)' },
  { pattern = '(?s)^[^\n]* \(#132\)(?:\n.*)?$', replace = 'fix: retain Linux compatibility with the current GNU toolchain (#132)' },
  { pattern = '(?s)^[^\n]* \(#133\)(?:\n.*)?$', replace = 'chore: remove obsolete package preparation branches (#133)' },
  { pattern = '(?s)^[^\n]* \(#135\)(?:\n.*)?$', replace = 'ci: prepare weekly releases with release-plz (#135)' },
  { pattern = '(?s)^Update daily dependencies \(#(\d+)\)(?:\n.*)?$', replace = 'fix(deps): update dependencies (#${1})' },
]
commit_parsers = [
  # GitHub's temporary PR merge commit is validation scaffolding, not a change.
  { message = '^Merge [0-9a-f]+ into [0-9a-f]+', skip = true },
  { message = "^feat\\(remove\\)!?:", group = "<!-- 0 -->Removed" },
  { message = "^feat\\(deprecate\\)!?:", group = "<!-- 1 -->Deprecated" },
  { message = "^[a-z]+(\\([^)]*\\))?!:", group = "<!-- 0 -->Changed" },
  { footer = "^BREAKING[ -]CHANGE:", group = "<!-- 0 -->Changed" },
  { message = "^feat(\\([^)]*\\))?:", group = "<!-- 1 -->Added" },
  { message = "^fix\\(deps\\):", group = "<!-- 4 -->Dependencies" },
  { message = "^fix\\(security\\):", group = "<!-- 2 -->Security" },
  { message = "^fix(\\([^)]*\\))?:", group = "<!-- 2 -->Fixed" },
  { message = "^perf(\\([^)]*\\))?:", group = "<!-- 3 -->Performance" },
  { message = "^docs(\\([^)]*\\))?:", group = "<!-- 5 -->Documentation" },
  { message = "^(chore|ci|build|test|style|refactor)(\\([^)]*\\))?:", skip = true },
  { message = ".*", group = "<!-- 6 -->Other changes" },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = false

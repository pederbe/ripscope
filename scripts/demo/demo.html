<!DOCTYPE html><html lang="en"><meta charset="utf-8"><title>Ripscope demo</title>
<style>
*{box-sizing:border-box}body{margin:0;width:1200px;height:675px;padding:28px 64px 0;background:#0e1621;color:#e4ecf3;font-family:"Noto Sans",system-ui,sans-serif;position:relative;overflow:hidden}
.layer{position:absolute;inset:0}.glow{background:radial-gradient(ellipse 60% 60% at 10% 8%,#ffdc6526,transparent 70%),radial-gradient(circle 420px at 95% 55%,#8ccbe41f,transparent 70%)}
.grid{background-image:linear-gradient(#8ccbe414 1px,transparent 1px),linear-gradient(90deg,#8ccbe414 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse 80% 70% at 60% 30%,#000,transparent)}
header,h1,.stage{position:relative}header{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;gap:12px;align-items:center;font-size:26px;font-weight:700;letter-spacing:-.5px}.brand svg{width:34px;height:34px;filter:drop-shadow(0 0 5px #ffdc6580)}.url{font-size:19px;color:#9fb1c4}
h1{margin:18px 0 20px;font-size:46px;line-height:1;letter-spacing:-1.8px;font-weight:700}h1 em{font-style:normal;color:#ffd24a;text-shadow:0 0 24px #ffd24a73}
.stage{display:flex;gap:26px;align-items:center}
.terminal{flex:none;border:1.5px solid #ffdc6566;border-radius:12px;overflow:hidden;background:#0a111a;box-shadow:0 0 60px #ffd24a1f}.bar{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;border-bottom:1px solid #304257;color:#9fb1c4;font:14px/1.3 "Noto Sans Mono","DejaVu Sans Mono",monospace}.dots{display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:50%;background:#304257}
pre{margin:0;padding:10px 20px 12px;white-space:pre;font:20px/25px "DejaVu Sans Mono",monospace;color:#e4ecf3;overflow:hidden}.cursor{background:#ffd24a;color:#0a111a}
.new{display:inline-block;width:calc(100% + 40px);margin:0 -20px;padding:0 20px;background:#ffd24a24;box-shadow:inset 4px 0 #ffd24a}
.steps{flex:1;display:flex;flex-direction:column;gap:14px;font:600 16px/1.2 "Noto Sans Mono","DejaVu Sans Mono",monospace}.steps div{display:flex;gap:11px;align-items:center;padding:11px 12px;border:1px solid #304257;border-radius:10px;background:#152233;color:#9fb1c4}
.steps b{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#304257;color:#e4ecf3;font:700 14px/1 "Noto Sans",sans-serif}.steps .on{background:#ffd24a;border-color:#ffd24a;color:#211507;box-shadow:0 0 28px #ffd24a59}.steps .on b{background:#211507;color:#ffd24a}
</style>
<div class="layer glow"></div><div class="layer grid"></div>
<header><span class="brand" id="brand"></span><span class="url">ripscope.com</span></header>
<h1>Save. Search. <em>Already there.</em></h1>
<div class="stage"><div class="terminal"><div class="bar"><span class="dots"><i></i><i></i><i></i></span><span>hello / main.c</span><span>Vim</span></div><pre id="screen"></pre></div><div class="steps" id="steps"></div></div>
</html>

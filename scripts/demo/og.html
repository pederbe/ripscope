<!DOCTYPE html><html lang="en"><meta charset="utf-8"><title>Ripscope social image</title>
<style>
*{box-sizing:border-box}body{margin:0;width:1200px;height:630px;background:#0e1621;color:#e4ecf3;font-family:"Noto Sans",system-ui,sans-serif;position:relative;overflow:hidden}
.layer{position:absolute;inset:0}.glow{background:radial-gradient(ellipse 62% 70% at 16% 22%,#ffdc652b,transparent 70%),radial-gradient(circle 380px at 88% 40%,#8ccbe430,transparent 70%)}
.grid{background-image:linear-gradient(#8ccbe417 1px,transparent 1px),linear-gradient(90deg,#8ccbe417 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse 75% 75% at 65% 40%,#000,transparent)}
.reticle{left:577px;top:5px;width:640px;height:640px}
header,main{position:absolute;left:64px;right:64px}header{top:36px;height:66px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffdc652e;padding-bottom:22px}
.brand{display:flex;gap:14px;align-items:center;font-size:32px;font-weight:700;letter-spacing:-.6px}.brand svg{width:40px;height:40px;filter:drop-shadow(0 0 6px #ffdc6580)}.url{font-size:22px;color:#9fb1c4}
main{top:102px;bottom:0;display:flex;justify-content:space-between;align-items:center}
.lead{flex:none;width:470px}h1{margin:0;font-size:82px;line-height:1.04;letter-spacing:-3.8px;font-weight:700}h1 em{display:block;font-style:normal;color:#ffd24a;text-shadow:0 0 30px #ffd24a8c}
.sub{margin:26px 0 0;font-size:29px;line-height:1.32;color:#c3cfdb;letter-spacing:-.3px}
.panel{border:1.5px solid #ffdc6573;border-radius:14px;background:#0a111a;box-shadow:0 0 70px #ffd24a29;overflow:hidden;font-family:"Noto Sans Mono","DejaVu Sans Mono",monospace}
.bar{display:flex;justify-content:space-between;align-items:center;padding:13px 20px;border-bottom:1px solid #304257;color:#9fb1c4;font-size:15px}.dots{display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:50%;background:#304257}
pre{margin:0;white-space:pre}#code{padding:12px 0;font-size:17px;line-height:28px}#code .row{display:block;padding:0 20px 0 0}#code .new{background:#8ccbe414;box-shadow:inset 3px 0 #8ccbe4}
.ln{display:inline-block;width:46px;padding-right:14px;text-align:right;color:#5a6d83}.ty{color:#8ccbe4}.st{color:#b3d4a2}
.cmd{padding:12px 20px;border-top:1px solid #304257;border-bottom:1px solid #304257;font-size:18px;color:#8ccbe4}
.qf{padding:12px 20px 16px}.qf .head{display:flex;justify-content:space-between;font-size:13px;letter-spacing:1.5px;color:#9fb1c4;margin-bottom:6px}#rows{font-size:14.5px;line-height:26px;color:#ffdc65}
</style>
<div class="layer glow"></div><div class="layer grid"></div>
<svg class="layer reticle" viewBox="-320 -320 640 640" fill="none" aria-hidden="true"><circle r="300" stroke="#ffdc65" stroke-opacity=".28" stroke-width="1.5"/><circle r="272" stroke="#8ccbe4" stroke-opacity=".28" stroke-width="1.5" stroke-dasharray="5 7"/><circle r="220" stroke="#ffdc65" stroke-opacity=".16" stroke-width="1.5"/><path d="M-300 0H300M0-300V300" stroke="#ffdc65" stroke-opacity=".2" stroke-width="1.5"/></svg>
<header><span class="brand" id="brand"></span><span class="url">ripscope.com</span></header>
<main><div class="lead"><h1>cscope's searches.<em>3–5× faster.</em></h1><p class="sub">On average,<br>in Vim, Neovim and Emacs.</p></div>
<div class="panel"><div class="bar"><span class="dots"><i></i><i></i><i></i></span><span>hello / main.c</span><span>Vim</span></div><pre id="code"></pre><div class="cmd">:cs find c greet</div><div class="qf"><div class="head"><span>QUICKFIX</span><span id="count"></span></div><pre id="rows"></pre></div></div></main>
</html>

[workspace]
# The Release workflow builds and qualifies each tag, creates its GitHub release
# and publishes the crate.
publish = false
changelog_update = false
git_release_enable = false
git_tag_name = "v{{ version }}"
release_always = false
features_always_increment_minor = true
pr_name = "chore: release{% if version %} v{{ version }}{% endif %}"
pr_body = """
## Problem

Unreleased changes need a versioned release.

## Solution
Update the Cargo version and matching editor metadata.

Update CHANGELOG.md with short entries linked to their pull requests.

## Validation

Required CI checks validate this release before automatic merging.
"""
release_commits = '^(feat|fix|perf|docs|revert)(\([^)]*\))?!?:|^[a-z]+(\([^)]*\))?!:|^[A-Z]|(?m:^BREAKING[ -]CHANGE:)'

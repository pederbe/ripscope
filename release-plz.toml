[workspace]
# The Release workflow builds and qualifies each tag, creates its GitHub release
# and publishes the crate.
publish = false
changelog_update = false
git_release_enable = false
git_tag_name = "v{{ version }}"
release_always = false
features_always_increment_minor = true
pr_name = "chore: release{% if version %} v{{ version }}{% endif %}"
release_commits = '^(feat|fix|perf|revert)(\([^)]*\))?!?:|^[a-z]+(\([^)]*\))?!:|^[A-Z]|(?m:^(?:BREAKING[ -]CHANGE:|Changelog: (?:Added|Changed|Fixed|Removed|Deprecated|Security|Performance|Dependencies):))'
